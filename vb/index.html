/* ===== router ===== */
let timer;
function route(keep){const k=(location.hash||'#home').slice(1);const r=P[k]?k:'home';
 $('#app').innerHTML=`<div class="page">${P[r]()}</div>`;if(!keep)scrollTo(0,0);
 document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+r));
 $('#links').classList.remove('open');clearInterval(timer);document.title='VELVET & BEAN — '+t(TK[r]);
 ({home:initHome,craft:initCraft,locations:initLoc,reserve:initRes,club:initClub})[r]?.()}
addEventListener('hashchange',()=>route());

function initHome(){let i=0;const go=n=>{i=n;document.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('on',j==n));document.querySelectorAll('#hd button').forEach((s,j)=>s.classList.toggle('on',j==n))};
 S.go=go;timer=setInterval(()=>go((i+1)%3),6000);showRev(0)}
function showRev(d){S.rev=(S.rev+d+3)%3;const r=REVS[L][S.rev];$('#rev').innerHTML=`<q>${r[0]}</q><p class="mut" style="margin-top:18px">${r[1]}</p>`}
function initCraft(){$('#st').innerHTML=STEPS.map((s,i)=>`<button data-a="step" data-i="${i}">${s[0][L]}<br><span class="mut">${s[2]}</span></button>`).join('');setStep(S.step)}
function setStep(i){S.step=i;const s=STEPS[i];document.querySelectorAll('#st button').forEach((b,j)=>b.classList.toggle('on',j==i));$('#sb').style.width=s[4]+'%';$('#sd').innerHTML=`<h3>${s[0][L]} <span class="gold">· ${s[1]}</span></h3><p class="mut" style="max-width:640px;margin-top:8px">${s[3][L]}</p>`}
function initLoc(){const l=LOCS[S.loc],o=isOpen(l);
 const pins=LOCS.map((p,i)=>`<g class="pin" data-a="loc" data-i="${i}"><circle cx="${p.x}" cy="${p.y}" r="${i==S.loc?14:8}" fill="${i==S.loc?'#C5A059':'#8A9378'}" opacity=".9"/><text x="${p.x+16}" y="${p.y+4}">${p.sn[L]}</text></g>`).join('');
 $('#ld').innerHTML=`<div><h3>${l.n[L]}</h3><p class="mut" style="margin:8px 0">${l.a[L]}</p><p>${l.d[L]}</p>
 <p style="margin:18px 0"><span class="dot ${o?'':'off'}" style="display:inline-block"></span> ${o?t('openNow'):t('closedNow')} · ${fmt(l.h[0])} – ${fmt(l.h[1])}, ${t('daily')}</p>
 <a class="btn" href="tel:${l.t.replace(/\s/g,'')}">${t('call',l.t)}</a> <a class="btn ghost" href="#reserve">${t('resHere')}</a></div>
 <svg class="map" viewBox="0 0 640 300" role="img" aria-label="${t('mapAria')}"><path d="M0 200C120 160 200 230 330 170S520 120 640 190M80 0C120 100 160 220 140 300M380 0C400 100 440 200 520 300" stroke="#3a3632" stroke-width="10" fill="none"/><path d="M0 110C150 90 300 130 640 60" stroke="#2f2c28" stroke-width="5" fill="none"/>${pins}</svg>`}
function initRes(){const d=$('#rd');d.min=new Date().toISOString().slice(0,10);
 $('#f').onsubmit=e=>{e.preventDefault();const E={};const g=id=>$('#'+id).value.trim();
 if(g('rn').length<2)E.rn=t('eName');if(!/^\S+@\S+\.\S+$/.test(g('re')))E.re=t('eMail');
 if(!g('rd'))E.rd=t('eDate');else if(g('rd')<d.min)E.rd=t('ePast');
 document.querySelectorAll('[data-e]').forEach(x=>x.textContent=E[x.dataset.e]||'');if(Object.keys(E).length)return;
 const ref='VB-'+Math.random().toString(36).slice(2,7).toUpperCase();
 $('#rf').innerHTML=`<div class="ok"><div class="gold">${t('okBook')}</div><div class="no">${ref}</div><p>${t('okBookP',esc($('#rt').value),$('#rg').value,esc($('#rl').value),g('rd'),$('#rm').value,esc(g('re')))}</p><button class="btn ghost" style="margin-top:22px" data-a="again">${t('again')}</button></div>`;toast(t('toastB'))}}
function initClub(){const c=C();const calc=()=>{const v=+$('#v').value,s=+$('#sp').value,pts=Math.round(v*(s/c.r)*52*2);$('#vv').textContent=v;$('#sv').textContent=money(s);
 let ti=0;TIERS.forEach((x,i)=>{if(pts>=x[1])ti=i});const n=TIERS[ti+1];
 $('#res').textContent=t('resLine',pts.toLocaleString(LB[L][3]),TIERS[ti][0][L]);
 $('#pb').style.width=(n?Math.min(100,(pts-TIERS[ti][1])/(n[1]-TIERS[ti][1])*100):100)+'%';
 $('#nx').textContent=n?t('nextT',n[0][L],(n[1]-pts).toLocaleString(LB[L][3])):t('topT');
 document.querySelectorAll('.tier').forEach((e,i)=>e.classList.toggle('on',i==ti))};
 $('#v').oninput=$('#sp').oninput=calc;calc();
 $('#f2').onsubmit=e=>{e.preventDefault();const E={};if($('#cn').value.trim().length<2)E.cn=t('eN');if(!/^\S+@\S+\.\S+$/.test($('#ce').value))E.ce=t('eMail');
 document.querySelectorAll('[data-e]').forEach(x=>x.textContent=E[x.dataset.e]||'');if(Object.keys(E).length)return;
 $('#cf').innerHTML=`<div class="ok"><div class="gold">${t('welcome')}</div><div class="no">${esc($('#cn').value.trim().split(' ')[0])}</div><p>${t('welcomeP')}</p></div>`;toast(t('toastM'))}}

/* ===== item modal ===== */
function openItem(id){const m=mi(id);S.item=m;S.qty=1;S.sel={};OPTS[m[1]].forEach(g=>S.sel[g.k]=0);drawItem();$('#mo').classList.add('open')}
function drawItem(){const m=S.item;$('#mbox').innerHTML=`<div style="display:flex;justify-content:space-between"><h3>${m[2][L]}</h3><button data-a="close" aria-label="${t('close')}">✕</button></div><p class="mut" style="margin-top:6px">${m[3][L]}</p>
${OPTS[m[1]].map(g=>`<div class="opt">${g.l[L]}</div><div class="chips">${g.o.map((o,i)=>`<button class="chip ${S.sel[g.k]==i?'on':''}" data-a="opt" data-k="${g.k}" data-v="${i}">${o[0][L]}${o[1]?' +'+money(loc(o[1])):''}</button>`).join('')}</div>`).join('')}
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px"><div class="qty"><button data-a="q" data-d="-1" aria-label="${t('less')}">−</button><span>${S.qty}</span><button data-a="q" data-d="1" aria-label="${t('more')}">+</button></div><button class="btn" data-a="add">${t('add',money(loc(unit(m,S.sel))*S.qty))}</button></div>`}

/* ===== cart ===== */
const lineP=c=>loc(unit(mi(c.id),c.sel));
const totals=()=>{const s=cart.reduce((a,c)=>a+lineP(c)*c.q,0),x=rnd(s*TAX);return{s,t:x,g:s+x}};
function drawCart(){$('#cnt').textContent=cart.reduce((a,c)=>a+c.q,0);const T=totals();
 $('#dr').innerHTML=`<div style="display:flex;justify-content:space-between"><h3>${t('cartT')}</h3><button data-a="dclose" aria-label="${t('cartClose')}">✕</button></div><div class="dbody">${cart.length?cart.map((c,i)=>{const m=mi(c.id);return `<div class="line"><div>${m[2][L]}<small>${labelOf(m,c.sel)}</small><div class="qty"><button data-a="cq" data-i="${i}" data-d="-1" aria-label="${t('less')}">−</button>${c.q}<button data-a="cq" data-i="${i}" data-d="1" aria-label="${t('more')}">+</button></div></div><div style="text-align:right">${money(lineP(c)*c.q)}<br><button class="mut" data-a="rm" data-i="${i}" style="font-size:.8rem;text-decoration:underline">${t('rm')}</button></div></div>`}).join(''):`<p class="mut">${t('empty')}</p>`}</div>
 <div class="row"><span>${t('sub')}</span><span>${money(T.s)}</span></div><div class="row"><span>${t('tax')}</span><span>${money(T.t)}</span></div><div class="row tot"><span>${t('tot')}</span><span>${money(T.g)}</span></div>
 ${cart.length?`<button class="btn" style="margin-top:18px;width:100%" data-a="checkout">${t('chk')}</button>`:`<a class="btn" href="#menu" style="margin-top:18px;text-align:center" data-a="dclose">${t('browse')}</a>`}`}
function checkout(){const T=totals();$('#dr').classList.remove('open');$('#cbox').innerHTML=`<div style="display:flex;justify-content:space-between"><h3>${t('payT')}</h3><button data-a="close" aria-label="${t('close')}">✕</button></div><form id="pf" novalidate><label for="pn">${t('cName')}</label><input id="pn"><div class="err" data-e="pn"></div><label for="pc">${t('cNo')}</label><input id="pc" inputmode="numeric" placeholder="4242 4242 4242 4242"><div class="err" data-e="pc"></div><div style="display:flex;gap:16px"><div style="flex:1"><label for="px">${t('cExp')}</label><input id="px" placeholder="${t('expPh')}"><div class="err" data-e="px"></div></div><div style="flex:1"><label for="pv">CVC</label><input id="pv" inputmode="numeric" maxlength="4"><div class="err" data-e="pv"></div></div></div><div class="row tot" style="margin-top:20px"><span>${t('tot')}</span><span>${money(T.g)}</span></div><button class="btn" style="margin-top:18px;width:100%">${t('payBtn',money(T.g))}</button></form>`;
 $('#co').classList.add('open');
 $('#pf').onsubmit=e=>{e.preventDefault();const E={},v=id=>$('#'+id).value.trim();
 if(v('pn').length<2)E.pn=t('eCN');if(v('pc').replace(/\s/g,'').length<13||/\D/.test(v('pc').replace(/\s/g,'')))E.pc=t('eCNo');
 if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(v('px')))E.px=t('eExp');if(!/^\d{3,4}$/.test(v('pv')))E.pv=t('eCvc');
 document.querySelectorAll('#pf [data-e]').forEach(x=>x.textContent=E[x.dataset.e]||'');if(Object.keys(E).length)return;
 const no='#'+(10000+Math.floor(Math.random()*89999)),g=money(T.g);cart.length=0;drawCart();
 $('#cbox').innerHTML=`<div class="ok"><div class="gold">${t('paid')}</div><div class="no">${t('orderN',no)}</div><p>${t('paidP',g)}</p><button class="btn" style="margin-top:22px" data-a="close">${t('done')}</button></div>`}}

/* ===== events ===== */
document.addEventListener('click',e=>{
 if(e.target.classList.contains('ovl'))e.target.classList.remove('open');
 const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;
 if(a=='lang')setLang(+d.i);
 else if(a=='cart'){drawCart();$('#dr').classList.add('open')}
 else if(a=='dclose')$('#dr').classList.remove('open');
 else if(a=='burger')$('#links').classList.toggle('open');
 else if(a=='close')document.querySelectorAll('.ovl').forEach(o=>o.classList.remove('open'));
 else if(a=='tab'){S.tab=d.k;route(true)}
 else if(a=='item')openItem(d.id);
 else if(a=='opt'){S.sel[d.k]=+d.v;drawItem()}
 else if(a=='q'){S.qty=Math.max(1,S.qty+ +d.d);drawItem()}
 else if(a=='add'){const f=cart.find(c=>c.id==S.item[0]&&JSON.stringify(c.sel)==JSON.stringify(S.sel));
  f?f.q+=S.qty:cart.push({id:S.item[0],sel:{...S.sel},q:S.qty});drawCart();$('#mo').classList.remove('open');toast(t('added',S.item[2][L]))}
 else if(a=='cq'){const c=cart[d.i];c.q+=+d.d;if(c.q<1)cart.splice(d.i,1);drawCart()}
 else if(a=='rm'){cart.splice(d.i,1);drawCart()}
 else if(a=='checkout')checkout();
 else if(a=='slide'){S.go(+d.i)}
 else if(a=='rev')showRev(+d.d);
 else if(a=='step')setStep(+d.i);
 else if(a=='loc'){S.loc=+d.i;route(true)}
 else if(a=='again')route(true);
});
addEventListener('keydown',e=>{if(e.key=='Escape'){document.querySelectorAll('.ovl').forEach(o=>o.classList.remove('open'));$('#dr').classList.remove('open')}});
if(matchMedia('(hover:hover) and (pointer:fine)').matches){document.body.classList.add('cc');let x=0,y=0,rx=0,ry=0;
 addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;$('#cur').style.transform=`translate(${x}px,${y}px)`;$('#ring').classList.toggle('h',!!e.target.closest('a,button,input,select,.card'))});
 (function l(){rx+=(x-rx)*.18;ry+=(y-ry)*.18;$('#ring').style.transform=`translate(${rx}px,${ry}px)`;requestAnimationFrame(l)})()}
renderChrome();drawCart();route();
</script>
